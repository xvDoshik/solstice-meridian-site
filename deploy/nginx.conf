server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.com;
    root /var/www/clinic;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/clinic;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.example.com;
    root /var/www/clinic;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/clinic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /;
    }
    if ($request_uri ~ ^/(.+)/index\.html(\?|$)) {
        return 301 /$1;
    }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) {
        return 301 /$1;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/contact {
        limit_except POST OPTIONS {
            deny all;
        }
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Requested-With $http_x_requested_with;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        client_max_body_size 16k;
    }

    location = /index.html {
        internal;
    }

    location = /categories {
        try_files /categories/index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|gif|svg|ico|woff2?|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }
}
